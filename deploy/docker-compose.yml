services:
  otlp-viewer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: otlp-viewer
    env_file:
      - ../.env.example
    environment:
      OTLP_VIEWER_HTTP_ADDR: :8080
      OTLP_VIEWER_DB_PATH: /data/otlp-viewer.db
    ports:
      - "8080:8080"
    volumes:
      - otlp_viewer_data:/data
    profiles: ["default", "demo"]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    profiles: ["demo"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - redpanda
    profiles: ["demo"]

  sample-generator:
    image: alpine:3.22
    command: ["/bin/sh", "-c", "while true; do echo '{\"resourceLogs\":[{\"resource\":{\"attributes\":[{\"key\":\"service.name\",\"value\":{\"stringValue\":\"demo-generator\"}}]},\"scopeLogs\":[{\"logRecords\":[{\"timeUnixNano\":\"1700000000000000000\",\"body\":{\"stringValue\":\"hello otlp viewer\"}}]}]}]}' > /tmp/msg.json; sleep 5; done"]
    profiles: ["demo"]

volumes:
  otlp_viewer_data:
